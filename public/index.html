<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader - تحميل الفيديوهات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            transition: all 0.3s;
            direction: ltr;
            text-align: left;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .platforms {
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            margin: 5px;
            color: white;
            font-size: 14px;
        }

        .badge.active {
            background: #4CAF50;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-mp4 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 2px solid white;
        }

        .btn-mp3 {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: 2px solid white;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: #dc3545;
            color: white;
        }

        .message.success {
            background: #28a745;
            color: white;
        }

        .message.info {
            background: #17a2b8;
            color: white;
        }

        .video-info {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .video-info.show {
            display: block;
        }

        .video-info img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .video-title {
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .video-details {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Media Downloader</h1>
        <div class="subtitle">تحميل الفيديوهات والصوت من YouTube بسهولة</div>
        
        <div class="platforms">
            <span class="badge active">✓ YouTube</span>
            <span class="badge">○ TikTok</span>
            <span class="badge">○ Instagram</span>
            <span class="badge">○ Facebook</span>
            <span class="badge">○ Twitter</span>
        </div>
        
        <div class="input-group">
            <label>رابط الفيديو:</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." dir="ltr">
        </div>
        
        <div class="button-group">
            <button class="btn-mp4" id="downloadMp4Btn">📹 تحميل MP4</button>
            <button class="btn-mp3" id="downloadMp3Btn">🎵 تحميل MP3</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: white; margin-top: 10px;">جاري التحميل...</p>
        </div>
        
        <div class="message" id="message"></div>
        <div class="video-info" id="videoInfo"></div>
    </div>

<script>
        const urlInput = document.getElementById('urlInput');
        const mp4Btn = document.getElementById('downloadMp4Btn');
        const mp3Btn = document.getElementById('downloadMp3Btn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');
        const videoInfoDiv = document.getElementById('videoInfo');
        
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            setTimeout(() => messageDiv.classList.remove('show'), 5000);
        }
        
        function setLoading(state) {
            if(state) {
                loading.classList.add('show');
                mp4Btn.disabled = mp3Btn.disabled = true;
            } else {
                loading.classList.remove('show');
                mp4Btn.disabled = mp3Btn.disabled = false;
            }
        }
        
        async function downloadMedia(type) {
            const url = urlInput.value.trim();
            if (!url) return showMessage('الرجاء إدخال رابط الفيديو', 'error');
            
            setLoading(true);
            
            try {
                // 1. نطلب من السيرفر الرابط المباشر للملف
                const response = await fetch(`/get-link?url=${encodeURIComponent(url)}&type=${type}`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error);
                }
                
                // 2. نفتح الرابط المباشر في تبويب جديد عشان يبدأ التحميل فوراً
                // ده بيحل مشكلة الوقت والمساحة لأن Vercel مش هو اللي بينقل الملف
                const link = document.createElement('a');
                link.href = data.downloadUrl;
                link.download = data.filename; // اسم الملف
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showMessage(`✅ بدء تحميل: ${data.filename}`, 'success');
                
            } catch (error) {
                console.error(error);
                showMessage('فشل التحميل: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        // ربط الأزرار
        mp4Btn.addEventListener('click', () => downloadMedia('mp4'));
        mp3Btn.addEventListener('click', () => downloadMedia('mp3'));
        
        // التحقق التلقائي من الرابط (نفس الكود القديم)
        let timeout;
        urlInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const url = e.target.value.trim();
            if (url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                timeout = setTimeout(async () => {
                    const response = await fetch('/validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                    const validation = await response.json();
                    if (validation.isValid && validation.platform === 'youtube') {
                        const minutes = Math.floor(validation.duration / 60);
                        const seconds = validation.duration % 60;
                        videoInfoDiv.innerHTML = `
                            <img src="${validation.thumbnail}" alt="Thumbnail">
                            <div class="video-title">🎬 ${validation.title}</div>
                            <div class="video-details">⏱️ المدة: ${minutes}:${seconds.toString().padStart(2, '0')}</div>
                        `;
                        videoInfoDiv.classList.add('show');
                    } else {
                        videoInfoDiv.classList.remove('show');
                    }
                }, 500);
            } else {
                videoInfoDiv.classList.remove('show');
            }
        });
    </script>
</body>
</html>
