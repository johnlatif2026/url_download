<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحميل MP4 / MP3</title>

<style>
body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:system-ui;
}

.box{
    width:400px;
    background:#111827;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}

button{
    width:48%;
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.mp4{background:#3b82f6;color:white;}
.mp3{background:#a855f7;color:white;}
</style>
</head>

<body>

<div class="box">
    <h2>تحميل الفيديو / الصوت</h2>

    <input id="url" placeholder="ضع الرابط هنا">

    <div>
        <button class="mp4" onclick="download('mp4')">MP4</button>
        <button class="mp3" onclick="download('mp3')">MP3</button>
    </div>
</div>

<script>
const API = "https://media-downloader.onrender.com/download";
    
function download(type){
    const url = document.getElementById("url").value;

    if(!url){
        alert("حط الرابط");
        return;
    }

    window.open(`${API}?url=${encodeURIComponent(url)}&type=${type}`, "_blank");
}
</script>

</body>
</html>
