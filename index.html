<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ساحر الوسائط - تحميل MP4 / MP3 من أي رابط</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1120 0%, #111827 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .magic-card {
            max-width: 680px;
            width: 100%;
            background: rgba(18, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E9F0FF, #A0C0FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            color: #9ca3cf;
            margin-bottom: 2rem;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px dashed #2d3a5e;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 6px;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            color: #cbd5ff;
            font-weight: 600;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .link-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: #0f1422;
            border: 1.5px solid #2a3650;
            border-radius: 2rem;
            font-size: 1rem;
            color: #f0f3ff;
            outline: none;
            transition: all 0.25s;
            direction: ltr;
            text-align: left;
        }

        .link-input:focus {
            border-color: #5f7ef2;
            box-shadow: 0 0 0 3px rgba(95, 126, 242, 0.3);
            background: #0b1020;
        }

        .link-input::placeholder {
            color: #4a5679;
            font-size: 0.85rem;
        }

        .double-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin: 2rem 0 1.5rem;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 1rem 0.8rem;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1f2a44;
            color: #eef3ff;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        .btn-mp4 {
            background: linear-gradient(105deg, #1d4ed8, #3b82f6);
            border-bottom: 2px solid #93c5fd;
        }

        .btn-mp3 {
            background: linear-gradient(105deg, #a21caf, #d946ef);
            border-bottom: 2px solid #f0abfc;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.35);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .result-area {
            margin-top: 1.8rem;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
        }

        .info-card {
            text-align: center;
            color: #b9c8ff;
            font-size: 0.9rem;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #1e2a4e;
            padding: 0.9rem 1.6rem;
            border-radius: 3rem;
            text-decoration: none;
            color: white;
            font-weight: 600;
            margin-top: 12px;
            transition: 0.2s;
            border: 1px solid #4c6ef5;
        }

        .download-link:hover {
            background: #2d3b6e;
            transform: scale(1.02);
        }

        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border-right: 4px solid #ef4444;
            padding: 0.8rem;
            border-radius: 1.2rem;
            color: #ffb4b4;
            font-weight: 500;
        }

        .note {
            font-size: 0.75rem;
            margin-top: 1.5rem;
            text-align: center;
            color: #5f6f9a;
            border-top: 1px solid #202a44;
            padding-top: 1.2rem;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .flex-icon {
            font-size: 1.25rem;
        }

        @media (max-width: 500px) {
            .magic-card {
                padding: 1.5rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="magic-card">
    <h1>⤻ ساحر الوسائط ⤺</h1>
    <div style="text-align: center;">
        <div class="sub">أي رابط سوشيال ميديا • فيديو MP4 • صوت MP3</div>
    </div>

    <div class="input-group">
        <label>🔗 رابط من أي شبكة اجتماعية (يوتيوب، تيك توك، انستجرام، تويتر، فيسبوك ...)</label>
        <input type="url" id="mediaLink" class="link-input" placeholder="https://www.instagram.com/reel/... أو https://youtu.be/... أو أي رابط آخر" dir="ltr">
    </div>

    <div class="double-buttons">
        <button id="mp4Btn" class="btn btn-mp4">📹 MP4 &nbsp; فيديو</button>
        <button id="mp3Btn" class="btn btn-mp3">🎵 MP3 &nbsp; صوت</button>
    </div>

    <div id="resultBox" class="result-area">
        <div class="info-card">
            ⚡ الصق الرابط ثم اختر MP4 أو MP3<br>
            سيتم تحويل الرابط إلى رابط تحميل مباشر.
        </div>
    </div>
    <div class="note">
        💡 ملاحظة: الخدمة تعمل عبر واجهة وسيطة مجانية. إذا فشل رابط معين، جرب رابط آخر من منصة مختلفة.
    </div>
</div>

<script>
    const linkInput = document.getElementById('mediaLink');
    const mp4Btn = document.getElementById('mp4Btn');
    const mp3Btn = document.getElementById('mp3Btn');
    const resultBox = document.getElementById('resultBox');

    function showLoading(message = "⏳ جاري تجهيز الرابط ...") {
        resultBox.innerHTML = `
            <div class="info-card" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <div class="spinner"></div>
                <span>${message}</span>
            </div>
        `;
    }

    function showError(errorText) {
        resultBox.innerHTML = `
            <div class="error-message">
                ⚠️ ${errorText}<br>
                <span style="font-size:0.8rem;">تأكد من الرابط وحاول مرة أخرى. الخدمة تدعم أغلب منصات التواصل.</span>
            </div>
        `;
    }

    function showDownloadLink(downloadUrl, format, originalUrl) {
        const formatUpper = format.toUpperCase();
        const icon = format === 'mp4' ? '📹' : '🎵';
        resultBox.innerHTML = `
            <div style="background: #0e1428; border-radius: 1.5rem; padding: 0.8rem; text-align: center;">
                <div style="margin-bottom: 12px; font-weight: bold; color:#cbd5ff;">✅ جاهز للتحميل بصيغة ${formatUpper}</div>
                <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="download-link">
                    ${icon} تحميل ${formatUpper} مباشر <span style="font-size:1.2rem;">⬇️</span>
                </a>
                <div style="font-size: 0.7rem; margin-top: 14px; color:#7c8ab3;">
                    🔗 الرابط الأصلي: <span dir="ltr" style="font-size:0.7rem;">${escapeHtml(originalUrl.substring(0, 55))}${originalUrl.length > 55 ? '...' : ''}</span>
                </div>
                <button id="resetBtn" style="margin-top: 12px; background: none; border:1px solid #3f4e78; color:#bfcbff; border-radius: 2rem; padding: 6px 14px; cursor:pointer; font-size:0.75rem;">🔄 رابط جديد</button>
            </div>
        `;
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                linkInput.value = '';
                linkInput.focus();
                resultBox.innerHTML = `<div class="info-card">✨ الصق رابط جديد واضغط أحد الأزرار.</div>`;
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // استخدام خدمة بديلة مع دعم CORS (Universal Video Downloader API)
    // نستخدم allinone تحويلة مجانية بدون CORS مشاكل
    async function fetchVideoUrl(link, type) {
        // استخدام خدمة "Convert2media" البديلة عبر Cors-Anywhere العام (مجاني ومحدود لكن للعرض)
        // أو استخدام خدمة "SaveIn" المجانية
        // الحل العملي: استخدام واجهة ثالثة مفتوحة المصدر: "ytdl" ولكن هنا نستخدم endpoint يعمل مباشرة
        
        // أفضل حل عملي: خدمة "piped" أو "invidious" ولكنها محدودة لليوتيوب فقط
        // لحل شامل: استخدام واجهة "video-downloader" من apivideo (تحتاج مفتاح)
        
        // البديل الأضمن: فتح رابط التحميل عبر نافذة جديدة باستخدام خدمة "socialdownloadr" المباشرة
        // لكني سأستخدم service يعيد رابط مباشر عبر "cobalt.tools" لكن مع تجاوز CORS باستخدام allorigins.win
        
        const corsProxy = "https://api.allorigins.win/raw?url=";
        const cobaltApi = "https://api.cobalt.tools/api/json";
        
        const requestBody = type === 'mp3' ? {
            url: link,
            aFormat: 'mp3',
            isAudioOnly: true,
            audioBitrate: '128'
        } : {
            url: link,
            isAudioOnly: false,
            videoQuality: 'max',
            audioBitrate: '128'
        };
        
        // المحاولة الأولى: عبر الـ proxy لتجاوز CORS
        try {
            const proxyUrl = corsProxy + encodeURIComponent(cobaltApi);
            const response = await fetch(proxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            if (data.status === 'error') throw new Error(data.error?.code || 'فشل التحميل');
            if (data.url) return data.url;
            if (data.stream?.url) return data.stream.url;
            throw new Error('لم نستطع الحصول على رابط');
        } catch (e) {
            console.warn('Proxy failed, trying direct (CORS may fail):', e);
            // محاولة مباشرة (قد تنجح في بعض البيئات)
            try {
                const response = await fetch(cobaltApi, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.url) return data.url;
                throw new Error('لا يوجد رابط');
            } catch (e2) {
                throw new Error('فشل الاتصال بخادم التحميل. يرجى المحاولة لاحقاً أو استخدام رابط من يوتيوب/تيك توك.');
            }
        }
    }

    async function handleDownload(format) {
        const rawLink = linkInput.value.trim();
        if (!rawLink) {
            showError('❌ الرجاء إدخال رابط منشور أو فيديو من أي شبكة اجتماعية.');
            return;
        }
        if (!rawLink.startsWith('http://') && !rawLink.startsWith('https://')) {
            showError('⚠️ الرابط يجب أن يبدأ بـ http:// أو https://');
            return;
        }
        
        const formatName = format === 'mp4' ? 'فيديو MP4' : 'صوت MP3';
        showLoading(`🔄 جاري معالجة الرابط وتحويله إلى ${formatName} ... (قد يستغرق بضع ثوانٍ)`);
        
        try {
            const downloadUrl = await fetchVideoUrl(rawLink, format);
            if (downloadUrl && downloadUrl.startsWith('http')) {
                showDownloadLink(downloadUrl, format, rawLink);
            } else {
                throw new Error('الرابط المسترجع غير صالح');
            }
        } catch (error) {
            let userMessage = error.message;
            if (userMessage.includes('UNSUPPORTED')) {
                userMessage = 'هذا الموقع غير مدعوم حالياً. جرب رابط من يوتيوب، تيك توك، انستجرام، فيسبوك، تويتر';
            } else if (userMessage.includes('فشل الاتصال')) {
                userMessage = 'مشكلة في الاتصال بالخادم. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.';
            } else {
                userMessage = `⚠️ فشل التحميل: ${userMessage}`;
            }
            showError(userMessage);
        }
    }

    mp4Btn.addEventListener('click', () => handleDownload('mp4'));
    mp3Btn.addEventListener('click', () => handleDownload('mp3'));
    
    linkInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleDownload('mp4');
        }
    });
    
    setTimeout(() => {
        if (!linkInput.value) {
            resultBox.innerHTML = `<div class="info-card">
                🌍 يدعم اليوتيوب، تيك توك، انستقرام، تويتر، فيسبوك، ريديت، تويش<br>
                ✨ الصق الرابط واختر جودة التحميل
            </div>`;
        }
    }, 100);
</script>
</body>
</html>
