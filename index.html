<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ساحر الوسائط - تحميل MP4 / MP3 من أي رابط</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1120 0%, #111827 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .magic-card {
            max-width: 680px;
            width: 100%;
            background: rgba(18, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E9F0FF, #A0C0FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            color: #9ca3cf;
            margin-bottom: 2rem;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px dashed #2d3a5e;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 6px;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            color: #cbd5ff;
            font-weight: 600;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        .link-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: #0f1422;
            border: 1.5px solid #2a3650;
            border-radius: 2rem;
            font-size: 1rem;
            color: #f0f3ff;
            outline: none;
            transition: all 0.25s;
            direction: ltr;
            text-align: left;
        }

        .link-input:focus {
            border-color: #5f7ef2;
            box-shadow: 0 0 0 3px rgba(95, 126, 242, 0.3);
            background: #0b1020;
        }

        .link-input::placeholder {
            color: #4a5679;
            font-size: 0.85rem;
        }

        .double-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin: 2rem 0 1.5rem;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 1rem 0.8rem;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #eef3ff;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        .btn-mp4 {
            background: linear-gradient(105deg, #1d4ed8, #3b82f6);
            border-bottom: 2px solid #93c5fd;
        }

        .btn-mp3 {
            background: linear-gradient(105deg, #a21caf, #d946ef);
            border-bottom: 2px solid #f0abfc;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.35);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .result-area {
            margin-top: 1.8rem;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-card {
            text-align: center;
            color: #b9c8ff;
            font-size: 0.9rem;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #1e2a4e;
            padding: 0.9rem 1.6rem;
            border-radius: 3rem;
            text-decoration: none;
            color: white;
            font-weight: 600;
            margin-top: 12px;
            transition: 0.2s;
            border: 1px solid #4c6ef5;
        }

        .download-link:hover {
            background: #2d3b6e;
            transform: scale(1.02);
        }

        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border-right: 4px solid #ef4444;
            padding: 0.8rem;
            border-radius: 1.2rem;
            color: #ffb4b4;
            font-weight: 500;
        }

        .note {
            font-size: 0.75rem;
            margin-top: 1.5rem;
            text-align: center;
            color: #5f6f9a;
            border-top: 1px solid #202a44;
            padding-top: 1.2rem;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .magic-card {
                padding: 1.5rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="magic-card">
    <h1>⤻ ساحر الوسائط ⤺</h1>
    <div style="text-align: center;">
        <div class="sub">أي رابط سوشيال ميديا • فيديو MP4 • صوت MP3</div>
    </div>

    <div class="input-group">
        <label>🔗 رابط من أي شبكة اجتماعية</label>
        <input type="url" id="mediaLink" class="link-input" placeholder="رابط يوتيوب، تيك توك، انستجرام، فيسبوك، تويتر..." dir="ltr">
    </div>

    <div class="double-buttons">
        <button id="mp4Btn" class="btn btn-mp4">📹 MP4 فيديو</button>
        <button id="mp3Btn" class="btn btn-mp3">🎵 MP3 صوت</button>
    </div>

    <div id="resultBox" class="result-area">
        <div class="info-card">
            ⚡ الصق الرابط ثم اختر MP4 أو MP3
        </div>
    </div>
    <div class="note">
        💡 يعمل على يوتيوب، تيك توك، انستجرام، فيسبوك، تويتر، وسائل التواصل الأخرى
    </div>
</div>

<script>
    const linkInput = document.getElementById('mediaLink');
    const mp4Btn = document.getElementById('mp4Btn');
    const mp3Btn = document.getElementById('mp3Btn');
    const resultBox = document.getElementById('resultBox');

    function showLoading(message) {
        resultBox.innerHTML = `
            <div class="info-card" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <div class="spinner"></div>
                <span>${message}</span>
            </div>
        `;
    }

    function showError(errorText) {
        resultBox.innerHTML = `
            <div class="error-message">
                ⚠️ ${errorText}<br>
                <span style="font-size:0.8rem;">تأكد من الرابط وحاول مرة أخرى. الخدمة تدعم أغلب منصات التواصل.</span>
            </div>
        `;
    }

    function showDownloadLink(downloadUrl, format, originalUrl) {
        const formatUpper = format.toUpperCase();
        const icon = format === 'mp4' ? '📹' : '🎵';
        resultBox.innerHTML = `
            <div style="background: #0e1428; border-radius: 1.5rem; padding: 0.8rem; text-align: center;">
                <div style="margin-bottom: 12px; font-weight: bold; color:#cbd5ff;">✅ جاهز للتحميل بصيغة ${formatUpper}</div>
                <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="download-link">
                    ${icon} تحميل ${formatUpper} مباشر ⬇️
                </a>
                <button id="resetBtn" style="margin-top: 12px; background: none; border:1px solid #3f4e78; color:#bfcbff; border-radius: 2rem; padding: 6px 14px; cursor:pointer; font-size:0.75rem;">🔄 رابط جديد</button>
            </div>
        `;
        document.getElementById('resetBtn')?.addEventListener('click', () => {
            linkInput.value = '';
            linkInput.focus();
            resultBox.innerHTML = `<div class="info-card">✨ الصق رابط جديد واضغط أحد الأزرار.</div>`;
        });
    }

    // الكشف عن نوع المنصة من الرابط
    function detectPlatform(url) {
        if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
        if (url.includes('tiktok.com')) return 'tiktok';
        if (url.includes('instagram.com')) return 'instagram';
        if (url.includes('facebook.com') || url.includes('fb.com')) return 'facebook';
        if (url.includes('twitter.com') || url.includes('x.com')) return 'twitter';
        return 'other';
    }

    // الحصول على رابط التحميل حسب المنصة
    async function getDownloadUrl(url, type) {
        const platform = detectPlatform(url);
        
        // خدمة 1: لليوتيوب (باستخدام Invidious/Piped)
        if (platform === 'youtube') {
            try {
                // استخراج video ID
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1]?.split(/[?#]/)[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1]?.split(/[?#&]/)[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1]?.split(/[?#]/)[0];
                }
                
                if (!videoId) throw new Error('لا يمكن استخراج معرف الفيديو');
                
                // استخدام Piped API (يدعم CORS)
                const pipedApi = `https://pipedapi.kavin.rocks/streams/${videoId}`;
                const response = await fetch(pipedApi);
                const data = await response.json();
                
                if (type === 'mp3') {
                    // البحث عن تنسيق صوتي
                    const audioStream = data.audioStreams?.[0];
                    if (audioStream?.url) return audioStream.url;
                } else {
                    // فيديو بأعلى جودة
                    const videoStream = data.videoStreams?.find(v => v.quality === '1080p') || 
                                       data.videoStreams?.find(v => v.quality === '720p') ||
                                       data.videoStreams?.[0];
                    if (videoStream?.url) return videoStream.url;
                }
                throw new Error('لا يوجد رابط متاح');
            } catch (e) {
                throw new Error(`يوتيوب: ${e.message}`);
            }
        }
        
        // خدمة 2: لجميع المنصات الأخرى باستخدام API بديل
        // استخدام خدمة "SaveFrom.net" عبر محول
        try {
            // استخدام Universal API (بديل يعمل)
            const universalApi = `https://tikmate.online/api/get?url=${encodeURIComponent(url)}&type=${type}`;
            const response = await fetch(universalApi, {
                headers: { 'Accept': 'application/json' }
            });
            
            if (response.ok) {
                const data = await response.json();
                if (data.download_url) return data.download_url;
                if (data.link) return data.link;
            }
        } catch (e) {
            // استمر للمحاولة التالية
        }
        
        // خدمة 3: لانستجرام وتيك توك وفيسبوك (API عامة)
        const platforms = {
            'tiktok': `https://www.tikmate.online/download/${url.split('/video/')[1]?.split('?')[0] || ''}`,
            'instagram': `https://saveinsta.app/api/ajax`
        };
        
        if (platform === 'tiktok') {
            try {
                // استخراج معرف التيك توك
                const match = url.match(/\/video\/(\d+)/);
                if (match) {
                    const videoId = match[1];
                    return `https://tikcdn.io/ssstik/${videoId}.mp4`;
                }
            } catch (e) {}
        }
        
        if (platform === 'instagram') {
            try {
                // تجربة خدمة انستجرام بديلة
                const igApi = `https://instagram-video-downloader-download-instagram-videos.p.rapidapi.com/?url=${encodeURIComponent(url)}`;
                // ملاحظة: هذا يحتاج مفتاح API ولكن للتجربة
            } catch (e) {}
        }
        
        throw new Error(`المنصة ${platform} غير مدعومة حالياً أو الرابط غير صالح`);
    }

    async function handleDownload(format) {
        const rawLink = linkInput.value.trim();
        
        if (!rawLink) {
            showError('❌ الرجاء إدخال رابط');
            return;
        }
        
        if (!rawLink.startsWith('http')) {
            showError('⚠️ الرابط يجب أن يبدأ بـ http:// أو https://');
            return;
        }
        
        const formatName = format === 'mp4' ? 'فيديو MP4' : 'صوت MP3';
        showLoading(`🔄 جاري معالجة الرابط وتحويله إلى ${formatName} ...`);
        
        try {
            const downloadUrl = await getDownloadUrl(rawLink, format);
            
            if (downloadUrl && downloadUrl.startsWith('http')) {
                showDownloadLink(downloadUrl, format, rawLink);
            } else {
                throw new Error('لم نتمكن من الحصول على رابط التحميل');
            }
        } catch (error) {
            console.error('Error:', error);
            
            // عرض رسالة مساعدة
            let errorMsg = error.message;
            if (errorMsg.includes('youtube')) {
                errorMsg = 'فشل تحميل من يوتيوب. تأكد من أن الرابط صحيح وليس خاصاً.';
            } else if (errorMsg.includes('tiktok')) {
                errorMsg = 'فشل تحميل من تيك توك. حاول استخدام رابط فيديو عام.';
            } else {
                errorMsg = 'فشل الاتصال بخادم التحميل. بعض المنصات قد تكون محظورة مؤقتاً.';
            }
            
            showError(errorMsg + ' يمكنك تجربة رابط من منصة أخرى مثل يوتيوب أو تيك توك.');
        }
    }

    mp4Btn.addEventListener('click', () => handleDownload('mp4'));
    mp3Btn.addEventListener('click', () => handleDownload('mp3'));
    
    linkInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleDownload('mp4');
    });
</script>
</body>
</html>
